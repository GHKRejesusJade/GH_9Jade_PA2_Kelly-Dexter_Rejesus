<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Tables and Images with Bootstrap</title>
</head>
<body>
    <h2 class="text-center">Naruto Characters - Team 7</h2>
    <div class="row">
    <img class="rounded mx-auto d-block col-lg-4" src="https://i.redd.it/efgzdey00y9f1.jpg" alt=" Uchiha Sasuke" height="300px" width="450px"> 
    <img class="rounded-circle mx-auto d-block col-lg-4" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHn4b2eCPRvhDYFIKWroawpxUKoCszaSK0IBazkolwag&s=10" alt="Uchiha Sakura" height="300px" width="450px"> 
    <img class="img-thumbnail mx-auto d-block col-lg-4" src="https://wallpaperaccess.com/full/3540535.png" alt="Uzumaki Naruto" height="300px" width="450px">
    </div>
    <h1 class="text-center">Bootstrap Table</h1>
    <img class="mx-auto d-block" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1ERgIy1sHV5-aUh_86vXrXsW1TF1LglMKs5aVUJdLBw&s=10" alt="Spiderman" height="350px" width="250px">
    <table class="table table-striped table-hover container">
        <tr>
            <th class="bg-primary" scope="col">Name</th>
            <th class="bg-primary" scope="col">Favorite Anime</th>
            <th class="bg-primary" scope="col">Protagonist</th>
        </tr>
        <tr>
            <td>Kelly Rejesus</td>
            <td>Haikyu</td>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhpOdAVhTVnJBLp19QWMlVi8zriYQPFxH3pCr7hqteug&s=10" height="150px" width="200px"></td>
        </tr>
        <tr>
            <td>Dyce Aquino</td>
            <td>Spiderman</td>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSkr_xbbhV-pAT1R_fVUmA-ZXk4JpxlrtrlVaGOqVJ_bQ&s=10" height="150px" width="200px"></td>
        </tr>
        <tr>
            <td>Renee Zamora</td>
            <td>Fate Apocrypha</td>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSdzX_K6I0MqTTfhbyQZqkScsTNCVoZLgN2Z3w_vnphaA&s=10" height="150px" width="200px"></td>
        </tr>
        <tr>
            <td>Autumn Narvaez</td>
            <td>Jojo's Bizarre Adventure</td>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRHNEw-oJrXOO1KgUfdDEBVgbojL7z3cTCo2Y6QQDIHew&s=10" height="150px" width="200px"></td>
        </tr>
    </table>
</body>
</html>
